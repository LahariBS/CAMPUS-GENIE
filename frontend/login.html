```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Genie | Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <header class="navbar">

        <a href="index.html" class="logo">
            🎓 <span>CAMPUS</span> <b>GENIE</b>
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="admission.html">
                Admission
            </a>

            <a href="internships.html">
                Internships
            </a>

            <a href="chatbot.html">
                Chatbot
            </a>

            <a href="login.html" class="login-btn active-login">
                ♙ Login
            </a>

        </nav>

    </header>


    <!-- =====================================================
         LOGIN SECTION
         ===================================================== -->

    <main class="center-page">

        <section class="login-card">

            <h1>
                Welcome Back! ✨
            </h1>

            <p class="login-subtitle">
                Login to continue your learning journey
            </p>


            <!-- Login form -->

            <form id="loginForm">

                <!-- Email -->

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- Remember / forgot -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>

                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login button -->

                <button
                    type="submit"
                    class="primary-btn full-btn"
                >
                    Login →
                </button>

            </form>


            <!-- Google login -->

            <div style="text-align: center; margin: 20px 0;">

                <p>
                    ─────── OR ───────
                </p>

                <button
                    type="button"
                    id="googleLogin"
                    class="primary-btn full-btn"
                >
                    🔵 Continue with Google
                </button>

            </div>


            <!-- Sign Up -->

            <p class="signup-text">

                Don't have an account?

                <a href="#" id="signUp">
                    Sign Up
                </a>

            </p>


            <!-- Message -->

            <p
                id="loginMessage"
                style="text-align: center; margin-top: 15px;"
            ></p>

        </section>

    </main>


    <!-- =====================================================
         FIREBASE
         ===================================================== -->

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup,
            sendPasswordResetEmail
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        // Firebase configuration

        const firebaseConfig = {

            apiKey: "AIzaSyBiyxWyKQN5SLQyGfjP5y2ICUouVPMxFJc",

            authDomain:
                "campus-genie-4feec.firebaseapp.com",

            projectId:
                "campus-genie-4feec",

            storageBucket:
                "campus-genie-4feec.firebasestorage.app",

            messagingSenderId:
                "568552685565",

            appId:
                "1:568552685565:web:8fae3621c873c5ef55e394"

        };


        // Initialize Firebase

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const googleProvider = new GoogleAuthProvider();


        // Elements

        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const googleButton =
            document.getElementById("googleLogin");

        const signUpButton =
            document.getElementById("signUp");

        const forgotPassword =
            document.getElementById("forgotPassword");

        const message =
            document.getElementById("loginMessage");


        // =====================================================
        // EMAIL LOGIN
        // =====================================================

        loginForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email = emailInput.value.trim();

            const password = passwordInput.value;

            message.textContent = "Logging in...";

            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                message.textContent =
                    "Login successful! 🎉";

                setTimeout(() => {

                    window.location.href =
                        "chatbot.html";

                }, 1000);

            }

            catch (error) {

                console.error(error);

                message.textContent =
                    "Login failed: " + error.message;

            }

        });


        // =====================================================
        // SIGN UP
        // =====================================================

        signUpButton.addEventListener("click", async (event) => {

            event.preventDefault();

            const email = emailInput.value.trim();

            const password = passwordInput.value;


            if (!email || !password) {

                message.textContent =
                    "Enter your email and password first.";

                return;

            }


            if (password.length < 6) {

                message.textContent =
                    "Password must contain at least 6 characters.";

                return;

            }


            message.textContent =
                "Creating your account...";


            try {

                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                message.textContent =
                    "Account created successfully! 🎉";

                setTimeout(() => {

                    window.location.href =
                        "chatbot.html";

                }, 1000);

            }

            catch (error) {

                console.error(error);

                message.textContent =
                    "Sign Up failed: " + error.message;

            }

        });


        // =====================================================
        // GOOGLE LOGIN
        // =====================================================

        googleButton.addEventListener("click", async () => {

            message.textContent =
                "Opening Google Sign-In...";


            try {

                await signInWithPopup(
                    auth,
                    googleProvider
                );

                message.textContent =
                    "Google login successful! 🎉";

                setTimeout(() => {

                    window.location.href =
                        "chatbot.html";

                }, 1000);

            }

            catch (error) {

                console.error(error);

                message.textContent =
                    "Google login failed: " +
                    error.message;

            }

        });


        // =====================================================
        // FORGOT PASSWORD
        // =====================================================

        forgotPassword.addEventListener(
            "click",
            async (event) => {

                event.preventDefault();

                const email =
                    emailInput.value.trim();


                if (!email) {

                    message.textContent =
                        "Enter your email first.";

                    return;

                }


                try {

                    await sendPasswordResetEmail(
                        auth,
                        email
                    );

                    message.textContent =
                        "Password reset email sent! 📧";

                }

                catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to send reset email.";

                }

            }
        );

    </script>


    <!-- Your existing JavaScript -->

    <script src="script.js"></script>

</body>

</html>
```
